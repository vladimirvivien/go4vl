# .github/workflows/test.yml
name: Tests

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Build (CGO_ENABLED=0)
      run: |
        CGO_ENABLED=0 go build ./...
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
        CGO_ENABLED=0 GOOS=linux GOARCH=arm go build ./...
        CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build ./...
        CGO_ENABLED=0 go test -tags=integration -c ./test -o /dev/null
        (cd examples/simplecam && CGO_ENABLED=0 go build -o /dev/null .)
        (cd examples/webcam && CGO_ENABLED=0 go build -o /dev/null .)

    - name: Run Unit Tests (CGO_ENABLED=0)
      run: CGO_ENABLED=0 go test -v -cover ./v4l2 ./device

    - name: Vet (CGO_ENABLED=0)
      run: CGO_ENABLED=0 go vet ./...

    - name: Install C headers for ABI parity verification
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential linux-headers-generic

    - name: Verify C ABI parity and race detector
      run: |
        CGO_ENABLED=1 go test -v -tags=cgo_verify ./v4l2 -run TestABI
        CGO_ENABLED=1 go test -race ./v4l2 ./device

  integration-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential linux-headers-generic

    - name: Install kernel headers and modules
      run: |
        sudo apt-get install -y linux-headers-$(uname -r)
        if ! modinfo videodev >/dev/null 2>&1; then
          sudo apt-get install -y linux-modules-extra-$(uname -r) || sudo apt-get install -y linux-modules-extra-azure
        fi

    - name: Build and load v4l2loopback
      run: |
        # Load the V4L2 subsystem (included in linux-modules-extra for Azure kernel)
        sudo modprobe videodev

        # Clone and build v4l2loopback from source
        git clone https://github.com/umlaeute/v4l2loopback.git /tmp/v4l2loopback
        cd /tmp/v4l2loopback
        make KERNEL_DIR=/lib/modules/$(uname -r)/build

        # Load directly from the build directory
        sudo insmod /tmp/v4l2loopback/v4l2loopback.ko devices=2 video_nr=10,11 card_label="go4vl_test_1,go4vl_test_2" exclusive_caps=0

        # Wait for udev to finish creating device nodes before setting permissions
        sudo udevadm settle
        sudo chmod 666 /dev/video10 /dev/video11

        # Verify it loaded
        echo "=== Loaded modules ==="
        lsmod | grep v4l2loopback

        echo "=== Video devices ==="
        ls -la /dev/video*

    - name: Run Integration Tests (CGO_ENABLED=0)
      run: |
        CGO_ENABLED=0 go test -v -tags=integration ./test/... -args -use-device-emulation=/dev/video10,/dev/video11 -require-streaming

    - name: Run Integration Tests (Race Detector)
      run: |
        CGO_ENABLED=1 go test -race -tags=integration ./test/... -args -use-device-emulation=/dev/video10,/dev/video11 -require-streaming
