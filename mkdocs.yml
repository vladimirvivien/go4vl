site_name: go4vl
site_description: Idiomatic Go bindings for the Linux Video4Linux2 (V4L2) and Media Controller APIs
site_author: Vladimir Vivien
site_url: https://vladimirvivien.github.io/go4vl/

repo_name: vladimirvivien/go4vl
repo_url: https://github.com/vladimirvivien/go4vl
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/go4vl-mark.png
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: Fira Code

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Docs:
      - Getting Started:
          - Welcome & Architecture: getting-started/index.md
          - Installation & Permissions: getting-started/install.md
          - Quick Start: getting-started/quickstart.md
          - Building & Cross-Compiling: BUILD.md
      - Core Guides:
          - Device Lifecycle & Options: guides/device.md
          - Streaming, I/O & Zero-Copy: guides/streaming.md
          - Formats, Multi-Planar & Metadata: guides/formats.md
          - Controls & Events: guides/controls.md
      - Advanced Media:
          - Media Controller & Sub-devices: guides/media-subdev.md
          - Codecs & Memory-to-Memory: guides/codecs-m2m.md
      - Testing & Performance:
          - Testing & CI: guides/testing.md
          - Benchmarks & Tuning: guides/benchmarks.md
  - Examples:
      - Overview: examples/index.md
  - Reference:
      - Package & V4L2 Map: reference/index.md
      - "device GoDoc (pkg.go.dev)": https://pkg.go.dev/github.com/vladimirvivien/go4vl/device
      - "v4l2 GoDoc (pkg.go.dev)": https://pkg.go.dev/github.com/vladimirvivien/go4vl/v4l2

copyright: >-
  Copyright &copy; 2021–2026 Vladimir Vivien and The go4vl Authors.

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vladimirvivien/go4vl
